<!DOCTYPE html>
<html lang="en" data-theme="system" data-font="medium">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TSMHST Portal | Tricent School of Medical Health Science and Technology</title>
<meta name="description" content="The official student and staff portal of Tricent School of Medical Health Science and Technology (TSMHST): units, assignments, results, transcripts, fees, hostel, attendance and campus notices.">
<meta name="theme-color" content="#3f8f1f">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TSMHST Portal">
<meta name="application-name" content="TSMHST Portal">
<link rel="stylesheet" href="css/app.css">
<script>
  (function () {
    try {
      var theme = localStorage.getItem('tsmhst.theme') || 'system';
      var font = localStorage.getItem('tsmhst.font') || 'medium';
      var lang = localStorage.getItem('tsmhst.lang') || 'en';
      var root = document.documentElement;
      root.dataset.theme = theme;
      root.dataset.font = font;
      root.lang = lang;
      var rtl = /^(ar|he|fa|ur|ps|sd|ug|yi|dv|ku|ckb)$/.test(lang);
      root.dir = rtl ? 'rtl' : 'ltr';
      if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#111710');
      }
    } catch (e) { /* storage unavailable */ }
  })();
</script>
</head>
<body>
<a class="skip-link" href="#app">Skip to main content</a>

<div id="app" role="application"></div>
<div id="modal-root"></div>
<div id="toast-root" role="status" aria-live="polite"></div>

<noscript>
  <div class="noscript">TSMHST Portal needs JavaScript enabled. Please turn on JavaScript in your browser and reload this page.</div>
</noscript>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/views.js"></script>
<script src="js/views-admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
