<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MongoDB sync test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    button { padding: .6rem 1rem; font-size: 1rem; }
    pre { background: #f2f2f2; padding: 1rem; border-radius: 8px; overflow: auto; }
  </style>
  <script src="mongo-sync.js"></script>
</head>
<body>
  <h1>MongoDB sync test</h1>
  <p>Click the button, wait 3 seconds, then open this page in another browser or phone. The same number should appear there.</p>
  <p>Saved counter: <strong id="count">0</strong></p>
  <button id="btn">Add 1</button>
  <h3>Status</h3>
  <pre id="status"></pre>
  <script>
    var el = document.getElementById("count");
    el.textContent = localStorage.getItem("sync-test-counter") || "0";
    document.getElementById("btn").onclick = function () {
      var n = Number(localStorage.getItem("sync-test-counter") || 0) + 1;
      localStorage.setItem("sync-test-counter", String(n));
      el.textContent = n;
    };
    setInterval(function () {
      document.getElementById("status").textContent =
        JSON.stringify(window.MongoSync ? window.MongoSync.status() : "mongo-sync.js not loaded", null, 2);
    }, 1000);
  </script>
</body>
</html>
