<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sync test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 620px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  button { padding: .6rem 1rem; font-size: 1rem; margin-right: .5rem; }
  pre { background: #f2f2f2; color: #111; padding: 1rem; border-radius: 8px; overflow: auto; }
  img { max-width: 160px; display: block; margin-top: .5rem; border: 1px solid #ccc; }
</style>
<script src="mongo-sync.js"></script>
<script src="mongo-files.js"></script>
</head>
<body>
<h1>Sync test</h1>

<h2>1. Saved data</h2>
<p>Counter: <strong id="count">0</strong></p>
<button id="btn">Add 1</button>
<p>Click, wait 3 seconds, then open this page in another browser and sign in. The same number should appear.</p>

<h2>2. Files</h2>
<p>Pick a small image. It is stored in this browser's IndexedDB, copied to the server, and shows up on your other devices.</p>
<input type="file" id="pick" accept="image/*">
<div id="pic"></div>

<h2>Status</h2>
<pre id="status"></pre>

<script>
  var el = document.getElementById("count");
  el.textContent = localStorage.getItem("sync-test-counter") || "0";
  document.getElementById("btn").onclick = function () {
    var n = Number(localStorage.getItem("sync-test-counter") || 0) + 1;
    localStorage.setItem("sync-test-counter", String(n));
    el.textContent = n;
  };

  function openDb() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open("sync-test-db", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("files", { keyPath: "id" }); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function showLatest() {
    openDb().then(function (db) {
      var all = db.transaction("files").objectStore("files").getAll();
      all.onsuccess = function () {
        var box = document.getElementById("pic");
        box.textContent = all.result.length + " file(s) stored here.";
        all.result.forEach(function (rec) {
          var img = document.createElement("img");
          img.src = URL.createObjectURL(rec.blob);
          img.alt = rec.name;
          box.appendChild(img);
        });
      };
    });
  }
  document.getElementById("pick").onchange = function () {
    var f = this.files[0];
    if (!f) return;
    openDb().then(function (db) {
      var tx = db.transaction("files", "readwrite");
      tx.objectStore("files").put({ id: "f" + Date.now(), name: f.name, blob: f });
      tx.oncomplete = showLatest;
    });
  };
  showLatest();

  setInterval(function () {
    document.getElementById("status").textContent = JSON.stringify({
      data: window.MongoSync ? window.MongoSync.status() : "mongo-sync.js not loaded",
      files: window.MongoFiles ? window.MongoFiles.status() : "mongo-files.js not loaded",
      keys: window.MongoSync ? window.MongoSync.keys() : null
    }, null, 2);
  }, 1000);
</script>
</body>
</html>
